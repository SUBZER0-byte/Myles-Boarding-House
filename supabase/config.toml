project_id = "myles-boarding-house"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
site_url = "https://myles-boarding-house.vercel.app"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://myles-boarding-house.vercel.app/**",
]

[functions.auth]
verify_jwt = false

[functions.admin-bootstrap]
verify_jwt = false

[functions.admin-dashboard]
verify_jwt = true

[functions.tenant-dashboard]
verify_jwt = true

[functions.admin-announcements]
verify_jwt = true

[functions.tenant-ratings]
verify_jwt = true

[functions.user-notifications]
verify_jwt = true

[functions.admin-notifications]
verify_jwt = true

[functions.admin-analytics]
verify_jwt = true

[functions.tenant-requests]
verify_jwt = true

[functions.stay-extensions]
verify_jwt = true

[functions.admin-ratings]
verify_jwt = true

[functions.admin-logs]
verify_jwt = true

[functions.admin-guests]
verify_jwt = true

[functions.admin-tenants]
verify_jwt = true

[functions.chatbot]
verify_jwt = false
